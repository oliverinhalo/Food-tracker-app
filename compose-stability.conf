// Types the Compose compiler should treat as stable.
//
// Our domain models are immutable data classes, but they live in framework-free modules
// (:core:model, :domain:*, :data:*) that deliberately do not depend on the Compose runtime, so they
// cannot carry @Immutable. Without this the compiler assumes the worst and every food row
// recomposes on any state change -- exactly the jank the reports exist to catch.
//
// This is a promise: anything listed here must stay genuinely immutable.
dev.foodtracker.core.model.*
dev.foodtracker.domain.nutrition.*
dev.foodtracker.domain.recognition.*
dev.foodtracker.data.diary.*
dev.foodtracker.data.nutrition.*

// Kotlin collections are read-only interfaces whose implementations we control at every call site.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
